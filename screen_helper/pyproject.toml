[project]
name = "glowcast-screen"
version = "0.1.0"
description = "Screen helper for Glowcast: serves a computer's screen, or test patterns, as 64x36 frames"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "aiohttp==3.14.5",
    "ifaddr==0.2.0",
    "mss==10.2.0",
    "pillow==13.0.0",
    "platformdirs==4.14.0",
    "zeroconf==0.151.5",
]

[project.scripts]
glowcast-screen = "glowcast_screen.cli:main"

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-aiohttp==1.1.1",
    "pytest-asyncio==1.4.1",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/glowcast_screen"]

[tool.uv]
# `uv run glowcast-screen` installs only what the helper needs; the tests add
# `--group dev`.
default-groups = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
