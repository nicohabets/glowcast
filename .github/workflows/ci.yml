name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install ruff==0.17.3
      - run: ruff check --output-format=github .

  pytest:
    name: pytest (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Minimum supported Home Assistant (2025.7.2, architecture D17).
          # aiowebostv: the version HA's webostv integration pins in that release.
          # pycares<5: HA 2025.7.2 pins aiodns 3.5.0, which breaks on pycares 5
          # (released after 2025.7.2) but does not exclude it.
          - name: minimum
            python: "3.13"
            phcc: "0.13.262"
            aiowebostv: "0.7.4"
            extra: "pycares<5"
          # Latest tested Home Assistant release (2026.10.4).
          - name: latest
            python: "3.14"
            phcc: "0.13.375"
            aiowebostv: "0.10.0"
            extra: ""
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      # The extra requirement goes through an environment variable so that a
      # character such as < is never parsed by the shell.
      - env:
          EXTRA: ${{ matrix.extra }}
        run: >-
          pip install
          pytest-homeassistant-custom-component==${{ matrix.phcc }}
          aiowebostv==${{ matrix.aiowebostv }}
          hue-entertainment==0.1.2
          $EXTRA
      - run: pytest

  # The screen helper (screen_helper/, #108): its own package and lock file,
  # tested on every OS it runs on, without a display (fakes and test patterns).
  screen-helper:
    name: screen helper (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest, windows-11-arm]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv run --project screen_helper --locked --group dev pytest screen_helper/tests
      # The documented command itself (the console script, not python -m).
      - run: uv run --project screen_helper --locked glowcast-screen --version
      # zeroconf has no wheel for Windows on ARM; this shows whether it was
      # compiled (.pyd/.so) or runs as pure Python (.py).
      - run: uv run --project screen_helper --locked python -c "import zeroconf._dns as m; print(m.__file__)"

  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
