name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install ruff==0.17.3
      - run: ruff check --output-format=github .

  pytest:
    name: pytest (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Minimum supported Home Assistant (2025.7.2, architecture D17).
          # aiowebostv: the version HA's webostv integration pins in that release.
          # pycares<5: HA 2025.7.2 pins aiodns 3.5.0, which breaks on pycares 5
          # (released after 2025.7.2) but does not exclude it.
          - name: minimum
            python: "3.13"
            phcc: "0.13.262"
            aiowebostv: "0.7.4"
            extra: "'pycares<5'"
          # Latest tested Home Assistant release (2026.10.4).
          - name: latest
            python: "3.14"
            phcc: "0.13.375"
            aiowebostv: "0.10.0"
            extra: ""
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: >-
          pip install
          pytest-homeassistant-custom-component==${{ matrix.phcc }}
          aiowebostv==${{ matrix.aiowebostv }}
          ${{ matrix.extra }}
      - run: pytest

  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          ignore: brands images
