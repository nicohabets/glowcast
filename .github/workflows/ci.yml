name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install ruff==0.17.3
      - run: ruff check --output-format=github .

  pytest:
    name: pytest (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Minimum supported Home Assistant (2026.8.3, architecture D17:
          # webOS 26 pairing). phcc 0.13.357 pins homeassistant==2026.8.3,
          # which needs Python >= 3.14.2. aiowebostv: the version HA's webostv
          # integration pins in that release.
          - name: minimum
            python: "3.14"
            phcc: "0.13.357"
            aiowebostv: "0.9.2"
          # Latest tested Home Assistant release (2026.10.4).
          - name: latest
            python: "3.14"
            phcc: "0.13.375"
            aiowebostv: "0.10.0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: >-
          pip install
          pytest-homeassistant-custom-component==${{ matrix.phcc }}
          aiowebostv==${{ matrix.aiowebostv }}
          hue-entertainment==0.1.2
      - run: pytest

  # The screen helper (screen_helper/, #108): its own package and lock file,
  # tested on every OS it runs on, without a display (fakes and test patterns).
  screen-helper:
    name: screen helper (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest, windows-11-arm]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv run --project screen_helper --locked --group dev pytest screen_helper/tests
      # The documented command itself (the console script, not python -m).
      - run: uv run --project screen_helper --locked glowcast-screen --version
      # zeroconf has no wheel for Windows on ARM; this shows whether it was
      # compiled (.pyd/.so) or runs as pure Python (.py).
      - run: uv run --project screen_helper --locked python -c "import zeroconf._dns as m; print(m.__file__)"

  # The end-to-end run (#112): the screen helper's test patterns through
  # Glowcast's real screen source, pipeline and Hue output to the demo's fake
  # bridge, in a local Home Assistant (the "latest" version above), all on
  # 127.0.0.1. See scripts/README.md.
  e2e:
    name: end-to-end (test patterns)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - run: python3 scripts/demo.py e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-logs
          path: |
            ~/.cache/glowcast-demo/instances/*-e2e/e2e-summary.json
            ~/.cache/glowcast-demo/instances/*-e2e/e2e/
            ~/.cache/glowcast-demo/instances/*-e2e/run/
            ~/.cache/glowcast-demo/instances/*-e2e/config/home-assistant.log
          if-no-files-found: ignore

  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
